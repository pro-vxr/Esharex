plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esharex.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.esharex.app'
        minSdk 24
        targetSdk 33
        versionCode 29
        versionName '2.6.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePath = System.getenv("EShareX_STORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("EShareX_STORE_PASSWORD")
                keyAlias System.getenv("EShareX_KEY_ALIAS")
                keyPassword System.getenv("EShareX_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Use Android's normal local debug signing for development.
        }
        release {
            minifyEnabled false
            if (System.getenv("EShareX_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.zxing:core:3.5.3'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
