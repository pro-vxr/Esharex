plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esharex.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.esharex.app'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// NanoHTTPD is used for the local HTTP file-sharing server.
// AppCompat is unnecessary because MainActivity uses native Android Activity.
dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// Prevent duplicate Kotlin classes from outdated JDK 7/8 artifacts.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
